[project]
name = "sdlc-worker-indexing"
version = "0.1.0"
description = "SDLC indexing worker — crawls tenant repos, indexes to Azure AI Search and Cosmos DB"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.0",
    "azure-cosmos>=4.9.0",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.9.0",
    "azure-search-documents>=11.6.0",
    "azure-servicebus>=7.14.2",
    "azure-storage-blob>=12.25.1",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.10.0",
    "pyyaml>=6.0.2",
]
